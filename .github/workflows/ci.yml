name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck bin/asimov
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: bin
      - name: ShellCheck hooks/pre-commit
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: hooks
      - name: ShellCheck install.sh
        run: shellcheck install.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Install bats-core
        run: |
          sudo apt-get install -y bats
      - name: Run tests
        run: make test | tee test-output.txt
      - name: Update test badge
        if: github.ref == 'refs/heads/main' && always()
        run: |
          COUNT=$(grep -c '^ok ' test-output.txt || echo 0)
          FAIL=$(grep -c '^not ok ' test-output.txt || echo 0)
          if [ "$FAIL" -gt 0 ]; then
            MSG="${COUNT} passing, ${FAIL} failing"
            COLOR="red"
          else
            MSG="${COUNT} passing"
            COLOR="brightgreen"
          fi
          curl -s -X PATCH \
            -H "Authorization: token ${{ secrets.GIST_TOKEN }}" \
            -d "{\"files\":{\"tests.json\":{\"content\":\"{\\\"schemaVersion\\\":1,\\\"label\\\":\\\"tests\\\",\\\"message\\\":\\\"${MSG}\\\",\\\"color\\\":\\\"${COLOR}\\\"}\"}}}" \
            https://api.github.com/gists/c99beaff02a1895916d78b8d2a8ad79d

  # Tags and publishes a release when ASIMOV_VERSION in bin/asimov changes on
  # main and that version has no tag yet. `asimov update` and install.sh only
  # install tagged releases, verified against the SHA256SUMS attached here.
  release:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release new version if untagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^ASIMOV_VERSION=' bin/asimov | cut -d'"' -f2)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          sha256sum bin/asimov hooks/pre-commit protocols/*.json > SHA256SUMS
          awk -v v="## ${VERSION}" '$0==v{p=1;next} /^## /{p=0} p' CHANGELOG.md > notes.md
          gh release create "$TAG" SHA256SUMS --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file notes.md
