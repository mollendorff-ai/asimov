current:
  version: "3.5.1"
  title: "migrate says only what it changed"
  status: released
  deliverables:
    - "migrate updates the pre-commit hook, and says so, only when it differs from the shipped one; no 'Updated pre-commit hook' or 'Migration complete' on a run that changed nothing"
    - "migrate does not call a protocol file edited when it differs from the shipped one only in whitespace"

previous:
  version: "3.5.0"
  title: "trim"

