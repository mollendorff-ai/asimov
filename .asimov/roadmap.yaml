  title: "next: decided by the first real builds"
  status: pending
  deliverables:
    - "Collect what goes wrong in the first real build-mode runs and fix the top items"
    - "Run a real build with Gemini CLI and with Codex CLI (tested with mocks only so far), in a sandbox; --max-usd does not apply to them, so cap with --max-loops, --max-hours and --stall"
    # Found in the real Claude build of 2026-11-17 (wordfreq spec, 3 milestones,
    # 3 runs, $2.19, about 6 minutes, every milestone released and verified).
    # Fixed since: the planning run now counts toward --max-usd and gets the
