# Asimov Roadmap
# See CHANGELOG.md for release history.

current:
  version: "3.3.0"
  title: "real builds and what they expose"
  status: pending
  deliverables:
    - "Run a real build with Gemini CLI and with Codex CLI (tested with mocks only so far), in a sandbox; --max-usd does not apply to them, so cap with --max-loops, --max-hours and --stall"
    - "Collect what goes wrong in those runs and fix the top items"
    - "Scaffold: record the project type as python (not generic) for a Python spec, and drop the interactive-mode advice ('run asimov to start') from the build's scaffold log"

previous:
  version: "3.2.0"
  title: "quality gate checks the staged snapshot"

backlog:
  - version: "3.4.0"
    title: "CI and supply-chain hardening"
    status: pending
    deliverables:
      - "Build mode re-runs the quality gate itself before a milestone counts, since an agent can skip the pre-commit hook with git commit --no-verify (today it is only told not to); needs a mock-agent test"
      - "Use one commit email in the build scaffold (history is already unified by .mailmap)"
      - "Sign releases, or state in the README and SECURITY.md that SHA256SUMS only catch corruption, not tampering"
  - version: "3.5.0"
    title: "split bin/asimov"
    status: pending
    deliverables:
      - "Split bin/asimov (about 1,600 lines) into sourced modules before adding any new feature; the existing tests must pass unchanged"
