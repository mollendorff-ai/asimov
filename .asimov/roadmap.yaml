# Asimov Roadmap
# See CHANGELOG.md for release history.
# Decided in the feature review of 2026-11-17. bin/asimov stays one script.

current:
  version: "3.6.0"
  title: "lanes: several sessions on one project"
  status: released
  deliverables:
    - "project.yaml lanes: (id, title, owns, releases) and one roadmap per lane in .asimov/roadmap/<id>.yaml, same schema as roadmap.yaml"
    - "asimov --lane <id> / ASIMOV_LANE: the lane's sprint, paths, other lanes and rule in the prompt; a project with lanes refuses to launch without one"
    - "status lists every lane; migrate creates missing lane roadmaps; the pre-commit hook warns on staged files outside the lane"
    - "a project without lanes behaves exactly as in 3.5.1"

previous:
  version: "3.5.1"
  title: "migrate says only what it changed"

backlog: []

# Held, not scheduled:
# - asimov migrate --ai (the agent fills in description/stack/conventions,
#   merges an edited protocol with a new one, sorts out unexpected files; on a
#   clean git tree, reviewed as a diff). Build it only when a real semantic
#   change to .asimov/ arrives; the Rust version's migration assistant was
#   part of its scope creep.
# - asimov config: the first command to drop if the tool should get smaller.
# - Real Gemini CLI and Codex CLI runs: no subscriptions.
