    - "The gate checks the working tree, not what is staged, so a commit can pass the hook while failing the gate on its own (the first wordfreq commit had pyproject.toml but no code or tests); check the staged snapshot, or document the limit"
    - "Cosmetic: the scaffold records type generic for a Python project, and its log ends with interactive-mode advice ('run asimov to start')"

